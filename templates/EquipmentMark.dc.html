<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; }
    a { color: #66705F; } a:hover { color: #788274; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 720px; height: 400px; background: #FFFFFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #33332F; letter-spacing: -0.008em; display: flex; flex-direction: column;">

  <div style="padding: 20px 26px 14px; border-bottom: 1px solid #E2E1DA;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #66705F;">Equipment mark — trailer &amp; panel</div>
    <div style="font-size: 11.5px; line-height: 1.5; color: #6E6C66; margin-top: 7px; max-width: 74ch;">Single colour, no gradient, legible at 40mm on painted steel. On dark equipment the mark inverts to white; sage is used only where the finish is light enough to hold it.</div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">

    <!-- light finish -->
    <div style="background: #F1F3F0; border-right: 1px solid #E2E1DA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 26px;">
      <div style="position: relative; padding: 20px 26px;">
        <div style="position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-top: 2px solid #000000; border-left: 2px solid #000000;"></div>
        <div style="position: absolute; top: 0; right: 0; width: 14px; height: 14px; border-top: 2px solid #000000; border-right: 2px solid #000000;"></div>
        <div style="position: absolute; bottom: 0; left: 0; width: 14px; height: 14px; border-bottom: 2px solid #000000; border-left: 2px solid #000000;"></div>
        <div style="position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-bottom: 2px solid #000000; border-right: 2px solid #000000;"></div>
        <div style="font-size: 30px; font-weight: 600; letter-spacing: -0.03em; color: #000000; line-height: 1;">TWB Designs</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: #66705F; margin-top: 9px; text-align: center;">eMACS</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6C66;">Light finish · black mark</div>
    </div>

    <!-- dark finish -->
    <div style="background: #3D3D38; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 26px;">
      <div style="position: relative; padding: 20px 26px;">
        <div style="position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-top: 2px solid #FFFFFF; border-left: 2px solid #FFFFFF;"></div>
        <div style="position: absolute; top: 0; right: 0; width: 14px; height: 14px; border-top: 2px solid #FFFFFF; border-right: 2px solid #FFFFFF;"></div>
        <div style="position: absolute; bottom: 0; left: 0; width: 14px; height: 14px; border-bottom: 2px solid #FFFFFF; border-left: 2px solid #FFFFFF;"></div>
        <div style="position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-bottom: 2px solid #FFFFFF; border-right: 2px solid #FFFFFF;"></div>
        <div style="font-size: 30px; font-weight: 600; letter-spacing: -0.03em; color: #FFFFFF; line-height: 1;">TWB Designs</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: #8A9585; margin-top: 9px; text-align: center;">eMACS</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #8C8A83;">Dark finish · white mark</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
