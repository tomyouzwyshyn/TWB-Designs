<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; }
    a { color: #66705F; } a:hover { color: #788274; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1280px; height: 720px; background: #FFFFFF; padding: 66px 76px 56px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #33332F; letter-spacing: -0.008em; position: relative; display: flex; flex-direction: column;">

  <div style="position: absolute; top: 34px; left: 34px; width: 30px; height: 30px; border-top: 1px solid #66705F; border-left: 1px solid #66705F;"></div>
  <div style="position: absolute; top: 34px; right: 34px; width: 30px; height: 30px; border-top: 1px solid #66705F; border-right: 1px solid #66705F;"></div>
  <div style="position: absolute; bottom: 34px; left: 34px; width: 30px; height: 30px; border-bottom: 1px solid #66705F; border-left: 1px solid #66705F;"></div>
  <div style="position: absolute; bottom: 34px; right: 34px; width: 30px; height: 30px; border-bottom: 1px solid #66705F; border-right: 1px solid #66705F;"></div>

  <div style="display: flex; align-items: baseline; gap: 14px;">
    <div style="font-size: 21px; font-weight: 600; letter-spacing: -0.028em; color: #000000;">TWB Designs</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #66705F;">Vault</div>
  </div>

  <div style="margin-top: auto; margin-bottom: 46px;">
    <div style="font-size: 62px; font-weight: 400; letter-spacing: -0.03em; line-height: 1.02; color: #000000; max-width: 17ch;">Presentation title goes here.</div>
    <div style="margin-top: 26px; font-size: 17px; line-height: 1.45; letter-spacing: -0.013em; color: #33332F; max-width: 52ch;">One supporting line that states the argument, not the agenda.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding-top: 22px; border-top: 1px solid #D3D9D0;">
    <div><div style="font-size: 22px; font-weight: 500; letter-spacing: -0.028em; color: #66705F;">2001</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: #6E6C66; margin-top: 6px;">In service since</div></div>
    <div><div style="font-size: 22px; font-weight: 500; letter-spacing: -0.028em; color: #66705F;">Same day</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: #6E6C66; margin-top: 6px;">Arrival to first burn</div></div>
    <div><div style="font-size: 22px; font-weight: 500; letter-spacing: -0.028em; color: #66705F;">Zero</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: #6E6C66; margin-top: 6px;">Custody transfers</div></div>
    <div><div style="font-size: 22px; font-weight: 500; letter-spacing: -0.028em; color: #66705F;">.50 cal</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: #6E6C66; margin-top: 6px;">Maximum calibre</div></div>
  </div>

</div>
</x-dc>

</html>
